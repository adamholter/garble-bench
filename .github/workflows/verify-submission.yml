name: verify submission
on:
  pull_request:
    paths: ["submissions/**"]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Only submission files changed
        run: |
          bad=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -v '^submissions/' || true)
          if [ -n "$bad" ]; then echo "A submission PR should only add files under submissions/:"; echo "$bad"; exit 1; fi
      - name: Verify
        run: python3 garble.py verify $(git diff --name-only --diff-filter=A origin/${{ github.base_ref }}...HEAD -- submissions/)
